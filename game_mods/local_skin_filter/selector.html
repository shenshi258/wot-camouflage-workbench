<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>车型涂装屏蔽</title>
<style>
:root{color-scheme:dark;--bg:#13181e;--panel:#1b222b;--line:#303b47;--text:#e9edf2;--muted:#9daab9;--gold:#f0c56d;--selected:#2c4459}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px "Microsoft YaHei UI","Microsoft YaHei",sans-serif;overflow:hidden}
button,input,select{font:inherit}button,select,input{border:1px solid var(--line);border-radius:6px;background:#232c37;color:var(--text);height:36px;padding:0 12px}
button{cursor:pointer;white-space:nowrap}button:hover{border-color:#72869b;background:#2b3846}button:disabled{opacity:.42;cursor:default}button.primary{background:var(--gold);border-color:var(--gold);color:#262017;font-weight:700}button.primary:hover{background:#ffdc94}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input[type=checkbox]{accent-color:var(--gold);width:17px;height:17px;cursor:pointer;padding:0;margin:0}
.app{height:100vh;min-height:440px;display:flex;flex-direction:column;padding:20px 24px;gap:14px}.header{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:23px;letter-spacing:.5px;margin:0 0 5px}.subtitle{color:var(--muted);font-size:12px}.right{text-align:right}.region{color:#c1ccd9;font-size:12px;margin-bottom:7px}.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13px}
.filters{display:grid;grid-template-columns:minmax(220px,1fr) 180px auto;gap:10px}.search{position:relative}.search input{width:100%;padding-left:35px}.search:before{content:'⌕';position:absolute;left:12px;top:3px;color:var(--muted);font-size:24px}.filters select{width:100%}.quick{border-color:#826940;color:#f4d38f;background:#302a20}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.selection-actions,.apply-actions{display:flex;align-items:center;gap:8px}.selection-actions button{height:31px;padding:0 10px;font-size:12px}.count{color:#b4c3d3;font-size:12px;margin-left:4px;white-space:nowrap}.apply-actions label{color:var(--muted);font-size:12px}.apply-actions select{width:146px}.apply-actions button{min-width:111px}
.table{min-height:120px;flex:1;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#171e26}.table-head,.car-row{display:grid;grid-template-columns:32px minmax(180px,1fr) 80px 114px 120px;align-items:center;padding:0 13px;column-gap:8px}.table-head{height:36px;min-height:36px;font-size:12px;color:var(--muted);background:#222c37;border-bottom:1px solid var(--line);padding-right:28px}.viewport{position:relative;overflow:auto;flex:1;min-height:80px;user-select:none;scrollbar-color:#526273 #1b222b}.car-row{height:42px;border-bottom:1px solid #27313c;cursor:default}.car-row:hover{background:#22303d}.car-row.selected{background:var(--selected);box-shadow:inset 3px 0 var(--gold)}.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.code{font-size:10px;color:#92a5b9;margin-top:1px}.nation,.cache{font-size:12px;color:#9cabbc}.cache.ready{color:#a0d9b9}.mode{font-size:11px;border:1px solid #435261;border-radius:4px;display:inline-block;padding:3px 7px;width:fit-content;color:#b5c1ce}.mode.enemy{border-color:#786344;color:#f2ce8b;background:#372f22}.mode.ally{border-color:#436f65;color:#a6d8c5;background:#243b35}.mode.both{border-color:#6b5d8e;color:#d0b9f6;background:#332d42}
.empty{padding:40px;text-align:center;color:var(--muted);line-height:1.8}.hint{font-size:11px;color:#8f9dac}.footer{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;font-size:11px;color:var(--muted);min-height:30px;line-height:1.6}.message{color:#c7d2df;text-align:right;max-width:58%}.message.error{color:#ffaf9e}.drag-box{position:fixed;border:1px solid #efca80;background:rgba(235,190,100,.17);pointer-events:none;z-index:20;display:none}.summary{color:#899aad;font-size:11px;margin-top:4px}
@media(max-width:820px){.app{padding:14px;gap:10px}.filters{grid-template-columns:minmax(180px,1fr) 145px}.filters .quick{grid-column:1/-1}.table-head,.car-row{grid-template-columns:26px minmax(150px,1fr) 66px 92px 90px;padding-left:9px;column-gap:5px}.toolbar{gap:10px}.apply-actions{margin-left:auto}h1{font-size:20px}}
</style></head><body>
<main class="app">
  <header class="header"><div><h1>车型涂装屏蔽</h1><div class="subtitle">搜索车型、拖框多选，再统一设置敌我范围。</div></div><div class="right"><div class="region" id="region">正在读取本区车型…</div><label class="toggle"><input type="checkbox" id="enabled" checked>启用屏蔽</label></div></header>
  <section class="filters"><div class="search"><input id="search" placeholder="搜索车型名称或编号，如 Pz70、AMX、G197" maxlength="80" autocomplete="off" aria-label="搜索车型"></div><select id="nation" aria-label="国家筛选"><option value="">全部国家</option></select><button class="quick" id="all-enemies" title="对所有国家和车型设置仅敌车，不受当前筛选限制">屏蔽全部敌车</button></section>
  <section class="toolbar"><div class="selection-actions"><button id="select-all">全选结果</button><button id="clear-selection">清空选择</button><span class="count" id="selection-count">已选 0 款</span></div><div class="apply-actions"><label for="mode">选中车型设置为</label><select id="mode"><option value="0">不屏蔽</option><option value="1" selected>仅敌车</option><option value="2">仅队友</option><option value="3">敌车和队友</option></select><button class="primary" id="apply" disabled>应用到已选</button></div></section>
  <div class="hint">按住鼠标拖框圈选；Ctrl 拖框追加，Shift 单击连续选择。切换筛选会保留已选车型。</div>
  <section class="table"><div class="table-head"><input type="checkbox" id="select-visible" aria-label="全选当前结果"><span>车型</span><span>国家</span><span>当前范围</span><span>原版资源</span></div><div id="viewport" class="viewport" tabindex="0" aria-label="车型列表"><div id="rows"><div class="empty">正在读取车型列表…</div></div></div></section>
  <footer class="footer"><div>只恢复本地涂装，自己的车保持不变。<div class="summary" id="summary">保存后在车库准备资源，下次正常加载生效。</div></div><div class="message" id="message" role="status">准备就绪后可开始选择。</div></footer>
</main><div id="drag-box" class="drag-box"></div>
<script>
(function(){
'use strict';
var nonce=(location.hash.slice(1).match(/^[a-f0-9]{64}/)||[''])[0], state={cars:[],rules:{},nations:[],revision:-1}, filtered=[],selected={},anchor=-1,lastRevision=-1,pending=0,drag=null,scrollTimer=null;
var $=function(id){return document.getElementById(id);}, vp=$('viewport'),rows=$('rows'),box=$('drag-box'),modeNames=['不屏蔽','仅敌车','仅队友','敌车和队友'],modeClasses=['','enemy','ally','both'];
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function keys(obj){return Object.keys(obj);}
function copy(obj){var result={};keys(obj).forEach(function(k){result[k]=true;});return result;}
function tell(text,error){$('message').textContent=text;$('message').className='message'+(error?' error':'');}
function request(route,data){return fetch(route,{method:data?'POST':'GET',headers:{'X-LSF-Key':nonce,'Content-Type':'application/json'},credentials:'omit',body:data?JSON.stringify(data):undefined}).then(function(r){if(!r.ok){throw Error('请求未完成（'+r.status+'）');}return r.json();});}
function counts(){var n=keys(selected).length,visible=filtered.filter(function(c){return selected[c.key];}).length;$('selection-count').textContent='已选 '+n+' 款'+(n>visible?' · 当前结果 '+visible:'');$('apply').disabled=!n||!!pending;$('select-visible').checked=!!filtered.length&&visible===filtered.length;$('select-visible').indeterminate=visible>0&&visible<filtered.length;}
function syncSelection(next){selected=next;Array.prototype.forEach.call(rows.querySelectorAll('.car-row'),function(row){var on=!!selected[row.getAttribute('data-key')];if(row.classList.contains('selected')!==on){row.classList.toggle('selected',on);row.querySelector('input').checked=on;}});counts();}
function filter(resetScroll){var nation=$('nation').value,query=$('search').value.trim().toLowerCase().split(/\s+/).filter(Boolean);filtered=state.cars.filter(function(c){return(!nation||c.nation===nation)&&query.every(function(q){return(c.label+' '+c.code+' '+c.key).toLowerCase().indexOf(q)>=0;});});anchor=-1;render(resetScroll);}
function render(resetScroll){var scroll=resetScroll?0:vp.scrollTop;if(!filtered.length){rows.innerHTML='<div class="empty">'+(state.loading?'正在读取本区车型…':'没有找到车型。试试名称、编号，或切换国家。')+'</div>';counts();return;}rows.innerHTML=filtered.map(function(c,i){var mode=state.rules[c.key]||0,cache=c.prepared?'已准备':(c.overridden?'等待准备':'无本地覆盖');return'<div class="car-row'+(selected[c.key]?' selected':'')+'" data-key="'+esc(c.key)+'" data-index="'+i+'" title="'+esc(c.label+' / '+c.code)+'"><input type="checkbox" aria-label="选择 '+esc(c.label)+'"'+(selected[c.key]?' checked':'')+'><div class="name">'+esc(c.label)+'<div class="code">'+esc(c.code)+'</div></div><span class="nation">'+esc(c.nationLabel)+'</span><span class="mode '+modeClasses[mode]+'">'+modeNames[mode]+'</span><span class="cache'+(c.prepared?' ready':'')+'">'+cache+'</span></div>';}).join('');vp.scrollTop=scroll;counts();}
function setBusy(){var busy=!!pending;$('all-enemies').disabled=busy||!state.cars.length;$('enabled').disabled=busy;counts();}
function command(value){if(pending)return;pending=-1;setBusy();tell('正在保存选择…');request('/api/command',value).then(function(r){pending=r.ticket;poll();}).catch(function(e){pending=0;setBusy();tell(e.message,true);});}
function accept(data){state=data;if(pending>0&&data.appliedTicket>=pending){pending=0;tell(data.commandError||data.commandMessage||'选择已保存。',!!data.commandError);}setBusy();$('enabled').checked=data.enabled!==false;$('region').textContent=(data.realm||'')+' '+(data.version||'')+' · '+data.cars.length+' 款车型';$('summary').textContent='检测到 '+(data.overrideCount||0)+' 款车型有本地覆盖；仅准备需要恢复的车型。';if(!pending&&data.progress&&!data.commandError){tell(data.commandMessage||data.progress);}if(data.revision!==lastRevision&&!drag){lastRevision=data.revision;var old=$('nation').value,options='<option value="">全部国家</option>';data.nations.forEach(function(n){options+='<option value="'+esc(n.key)+'">'+esc(n.label)+'</option>';});$('nation').innerHTML=options;$('nation').value=old;filter(false);}}
function poll(){request('/api/state').then(accept).catch(function(){tell('暂时无法读取设置。请从游戏模组列表重新打开本窗口。',true);});}
$('search').addEventListener('input',function(){filter(true);});$('nation').addEventListener('change',function(){filter(true);});
$('select-all').addEventListener('click',function(){var next=copy(selected);filtered.forEach(function(c){next[c.key]=true;});syncSelection(next);});
$('select-visible').addEventListener('change',function(){var next=copy(selected),on=this.checked;filtered.forEach(function(c){if(on)next[c.key]=true;else delete next[c.key];});syncSelection(next);});
$('clear-selection').addEventListener('click',function(){syncSelection({});});
$('apply').addEventListener('click',function(){command({kind:'rules',keys:keys(selected),mode:Number($('mode').value)});});
$('all-enemies').addEventListener('click',function(){command({kind:'all_enemies'});});
$('enabled').addEventListener('change',function(){command({kind:'enabled',enabled:this.checked});});
rows.addEventListener('click',function(e){if(e.target.tagName!=='INPUT')return;var row=e.target.closest('.car-row');if(!row)return;var next=copy(selected),key=row.getAttribute('data-key');if(e.target.checked)next[key]=true;else delete next[key];syncSelection(next);});
function position(e){var r=vp.getBoundingClientRect();return{x:Math.max(0,Math.min(vp.clientWidth,e.clientX-r.left-vp.clientLeft)),y:Math.max(0,Math.min(vp.clientHeight,e.clientY-r.top-vp.clientTop))+vp.scrollTop};}
function updateDrag(){if(!drag||!drag.active)return;var p=position(drag.last),low=Math.min(drag.start.y,p.y),high=Math.max(drag.start.y,p.y),next=copy(drag.base),first=Math.max(0,Math.floor(low/42)),last=Math.min(filtered.length-1,Math.floor(high/42));if(Math.abs(p.x-drag.start.x)>=1){for(var i=first;i<=last;i++){if(high>i*42&&low<(i+1)*42)next[filtered[i].key]=true;}}syncSelection(next);var r=vp.getBoundingClientRect(),top=r.top+vp.clientTop,bottom=top+vp.clientHeight,y1=Math.max(top,Math.min(bottom,top+drag.start.y-vp.scrollTop)),y2=Math.max(top,Math.min(bottom,drag.last.clientY));box.style.display='block';box.style.left=(r.left+vp.clientLeft+Math.min(drag.start.x,p.x))+'px';box.style.top=Math.min(y1,y2)+'px';box.style.width=Math.max(1,Math.abs(p.x-drag.start.x))+'px';box.style.height=Math.max(1,Math.abs(y2-y1))+'px';}
vp.addEventListener('mousedown',function(e){if(e.button!==0||e.target.tagName==='INPUT'||!filtered.length)return;e.preventDefault();var row=e.target.closest('.car-row');drag={start:position(e),origin:{x:e.clientX,y:e.clientY},last:{clientX:e.clientX,clientY:e.clientY},base:e.ctrlKey||e.metaKey?copy(selected):{},active:false,index:row?Number(row.getAttribute('data-index')):-1,ctrl:e.ctrlKey||e.metaKey,shift:e.shiftKey};scrollTimer=setInterval(function(){if(!drag||!drag.active)return;var r=vp.getBoundingClientRect(),delta=drag.last.clientY<r.top+28?-18:(drag.last.clientY>r.bottom-28?18:0);if(delta){vp.scrollTop+=delta;updateDrag();}},35);});
document.addEventListener('mousemove',function(e){if(!drag)return;drag.last={clientX:e.clientX,clientY:e.clientY};if(!drag.active&&(Math.abs(e.clientX-drag.origin.x)>4||Math.abs(e.clientY-drag.origin.y)>4)){drag.active=true;}updateDrag();});
function finish(){if(!drag)return;if(!drag.active){var next=drag.ctrl?copy(selected):{};if(drag.index>=0){if(drag.shift&&anchor>=0){for(var i=Math.min(anchor,drag.index);i<=Math.max(anchor,drag.index);i++){next[filtered[i].key]=true;}}else{var key=filtered[drag.index].key;if(drag.ctrl&&next[key])delete next[key];else next[key]=true;anchor=drag.index;}}syncSelection(next);}drag=null;clearInterval(scrollTimer);scrollTimer=null;box.style.display='none';}
document.addEventListener('mouseup',finish);window.addEventListener('blur',finish);document.addEventListener('keydown',function(e){if(e.key==='Escape'){finish();return;}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='a'&&e.target.tagName!=='INPUT'){e.preventDefault();$('select-all').click();}});
if(!nonce){tell('请从游戏内模组列表打开此窗口。',true);return;}poll();setInterval(poll,1500);
})();
</script></body></html>
