<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>车型涂装屏蔽</title>
<style>
:root{color-scheme:dark;--bg:#13181e;--panel:#1b222b;--line:#303b47;--text:#e9edf2;--muted:#9daab9;--gold:#f0c56d;--selected:#2c4459}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px "Microsoft YaHei UI","Microsoft YaHei",sans-serif;overflow:hidden}
button,input,select{font:inherit}button,select,input{border:1px solid var(--line);border-radius:6px;background:#232c37;color:var(--text);height:36px;padding:0 12px}
button{cursor:pointer;white-space:nowrap}button:hover{border-color:#72869b;background:#2b3846}button:disabled{opacity:.42;cursor:default}button.primary{background:var(--gold);border-color:var(--gold);color:#262017;font-weight:700}button.primary:hover{background:#ffdc94}button:focus,input:focus{outline:2px solid var(--gold);outline-offset:2px}

 .lsf-root{height:100vh;min-height:440px;display:flex;flex-direction:column;padding:20px 24px;gap:14px}.header{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:23px;letter-spacing:.5px;margin:0 0 5px}.subtitle{color:var(--muted);font-size:12px}.right{text-align:right}.region{color:#c1ccd9;font-size:12px;margin-bottom:7px}.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13px}
.filters{display:flex}.search{position:relative}.search input{width:100%;padding-left:35px}.search:before{content:'⌕';position:absolute;left:12px;top:3px;color:var(--muted);font-size:24px}.filters select{width:100%}.quick{border-color:#826940;color:#f4d38f;background:#302a20}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.selection-actions,.apply-actions{display:flex;align-items:center;gap:8px}.selection-actions button{height:31px;padding:0 10px;font-size:12px}.count{color:#b4c3d3;font-size:12px;margin-left:4px;white-space:nowrap}.apply-actions label{color:var(--muted);font-size:12px}.apply-actions select{width:146px}.apply-actions button{min-width:111px}
.table{min-height:120px;flex:1;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#171e26}.table-head,.car-row{display:flex;align-items:center;padding:0 13px;column-gap:8px}.table-head{height:36px;min-height:36px;font-size:12px;color:var(--muted);background:#222c37;border-bottom:1px solid var(--line);padding-right:28px}.viewport{position:relative;overflow:auto;flex:1;min-height:80px;user-select:none;scrollbar-color:#526273 #1b222b}.car-row{height:42px;border-bottom:1px solid #27313c;cursor:default}.car-row:hover{background:#22303d}.car-row.selected{background:var(--selected);box-shadow:inset 3px 0 var(--gold)}.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.code{font-size:10px;color:#92a5b9;margin-top:1px}.nation,.cache{font-size:12px;color:#9cabbc}.cache.ready{color:#a0d9b9}.mode{font-size:11px;border:1px solid #435261;border-radius:4px;display:inline-block;padding:3px 7px;width:fit-content;color:#b5c1ce}.mode.enemy{border-color:#786344;color:#f2ce8b;background:#372f22}.mode.ally{border-color:#436f65;color:#a6d8c5;background:#243b35}.mode.both{border-color:#6b5d8e;color:#d0b9f6;background:#332d42}
.empty{padding:40px;text-align:center;color:var(--muted);line-height:1.8}.hint{font-size:11px;color:#8f9dac}.footer{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;font-size:11px;color:var(--muted);min-height:30px;line-height:1.6}.message{color:#c7d2df;text-align:right;max-width:58%}.message.error{color:#ffaf9e}.drag-box{position:fixed;border:1px solid #efca80;background:rgba(235,190,100,.17);pointer-events:none;z-index:20;display:none}.summary{color:#899aad;font-size:11px;margin-top:4px}
@media(max-width:820px){ .lsf-root{padding:14px;gap:10px}.filters{flex-wrap:wrap}.filters .quick{margin-left:10px}.table-head,.car-row{padding-left:9px;column-gap:5px}.toolbar{gap:10px}.apply-actions{margin-left:auto}h1{font-size:20px}}

@font-face{font-family:LSFChinese;src:url('coui://gui/gameface/fonts/WarheliosZHCN-Medium.ttf')}
@font-face{font-family:LSFChinese;src:url('coui://gui/gameface/fonts/WarheliosZHCN-Bold.ttf');font-weight:700}
html,body{width:100%;height:100%}body{font-family:LSFChinese,"Microsoft YaHei",sans-serif} .lsf-root{height:100%;min-height:440px}
.lsf-root>div{flex-shrink:0;margin-bottom:12px}.lsf-root>.table{flex-shrink:1;flex-grow:1}.lsf-root>.footer{margin-bottom:0}
.header .right{margin-left:auto;margin-right:12px}.search{flex:1}.search:before{content:''}.search input{padding-left:12px}
.filters>.dropdown{width:175px;margin:0 10px}.dropdown{position:relative;flex-shrink:0}.dropdown>button{width:100%;text-align:left}
.choices{display:none;position:absolute;left:0;top:36px;width:100%;max-height:350px;overflow:auto;z-index:50;background:#202a35;border:1px solid #687b90;padding:4px}
.choices.open{display:flex;flex-direction:column}.choices>button{height:27px;flex-shrink:0;width:100%;border:0;text-align:left;border-radius:0;font-size:12px;padding:0 8px}
.apply-actions .dropdown{width:146px}.apply-actions>*{margin-left:8px}.selection-actions>*{margin-right:8px}
.check{display:flex;align-items:center;justify-content:center;flex-shrink:0;width:19px;height:19px;padding:0;border:1px solid #8d9faf;border-radius:3px;color:#181c21;background:#1b2734;font-size:14px}
.check.on{background:#f0c56d;border-color:#f0c56d}.toggle>.check{margin-right:8px}
.table-head>*:first-child,.car-row>*:first-child{width:19px;margin-right:13px}.table-head>*:nth-child(2),.car-row>.name{flex:1;min-width:150px}
.table-head>*:nth-child(3),.car-row>.nation{width:80px;flex-shrink:0;margin-left:8px}.table-head>*:nth-child(4),.car-row>.mode{width:114px;flex-shrink:0;margin-left:8px}
.table-head>*:nth-child(5),.car-row>.cache{width:120px;flex-shrink:0;margin-left:8px}.code{display:block}.mode{display:block}
.table-head{flex-shrink:0}.viewport{height:0;flex:1;min-height:80px;overflow:scroll}.hint{height:18px}.footer>div{max-width:54%}
@media(max-width:820px){ .lsf-root{padding:12px}.lsf-root>div{margin-bottom:9px}.toolbar{flex-wrap:wrap}.apply-actions{margin-left:auto;margin-top:5px}.table-head>*:nth-child(3),.car-row>.nation{width:60px}.table-head>*:nth-child(4),.car-row>.mode{width:95px}.table-head>*:nth-child(5),.car-row>.cache{width:87px}}

.spacer{width:1px;flex-shrink:0;pointer-events:none}
</style></head><body>
<div class="lsf-root">
  <div class="header"><div><h1>车型涂装屏蔽</h1><div class="subtitle">搜索车型、拖框多选，再统一设置敌我范围。</div></div><div class="right"><div class="region" id="region">正在读取本区车型…</div><div class="toggle"><button type="button" class="check on" role="checkbox" id="enabled" aria-label="启用屏蔽"></button>启用屏蔽</div></div><button id="close" aria-label="关闭">关闭</button></div>
  <div class="filters"><div class="search"><input id="search" placeholder="搜索车型名称或编号，如 Pz70、AMX、G197" maxlength="80" autocomplete="off" aria-label="搜索车型"></div><div class="dropdown"><button id="nation" aria-label="国家筛选">全部国家</button><div class="choices" id="nation-choices"></div></div><button class="quick" id="all-enemies" title="对所有国家和车型设置仅敌车，不受当前筛选限制">屏蔽全部敌车</button></div>
  <div class="toolbar"><div class="selection-actions"><button id="select-all">全选结果</button><button id="clear-selection">清空选择</button><span class="count" id="selection-count">已选 0 款</span></div><div class="apply-actions"><label for="mode">选中车型设置为</label><div class="dropdown"><button id="mode">仅敌车</button><div class="choices" id="mode-choices"></div></div><button class="primary" id="apply" disabled>应用到已选</button></div></div>
  <div class="hint">按住鼠标拖框圈选；Ctrl 拖框追加，Shift 单击连续选择。切换筛选会保留已选车型。</div>
  <div class="table"><div class="table-head"><button class="check" role="checkbox" id="select-visible" aria-label="全选当前结果"></button><span>车型</span><span>国家</span><span>当前范围</span><span>原版资源</span></div><div id="viewport" class="viewport" tabindex="0" aria-label="车型列表"><div id="rows"><div class="empty">正在读取车型列表…</div></div></div></div>
  <div class="footer"><div>只恢复本地涂装，自己的车保持不变。<div class="summary" id="summary">保存后在车库准备资源，下次正常加载生效。</div></div><div class="message" id="message" role="status">准备就绪后可开始选择。</div></div>
</div><div id="drag-box" class="drag-box"></div>
<script>
(function(){
'use strict';
var nonce=(location.hash.slice(1).match(/^[a-f0-9]{64}/)||[''])[0], state={cars:[],rules:{},nations:[],revision:-1}, filtered=[],selected={},anchor=-1,lastRevision=-1,pending=0,drag=null,scrollTimer=null,nativeView=!!window.engine,clientTicket=0,lastPayload=null,windowStart=-1,windowEnd=-1;
var $=function(id){return document.getElementById(id);}, vp=$('viewport'),rows=$('rows'),box=$('drag-box'),modeNames=['不屏蔽','仅敌车','仅队友','敌车和队友'],modeClasses=['','enemy','ally','both'];
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function keys(obj){return Object.keys(obj);}
function copy(obj){var result={};keys(obj).forEach(function(k){result[k]=true;});return result;}
function tell(text,error){$('message').textContent=text;$('message').className='message'+(error?' error':'');}
function request(route,data){
 if(nativeView){
  if(!window.model) return Promise.reject(Error('游戏界面尚未准备好。'));
  if(data){clientTicket=Math.max(Date.now(),clientTicket,Number(state.appliedTicket)||0)+1;window.model.onCommand({payload:JSON.stringify({ticket:clientTicket,command:data})});return Promise.resolve({ticket:clientTicket});}
  var raw=String(window.model.payload||'{}');if(raw===lastPayload)return Promise.resolve(null);return Promise.resolve().then(function(){var data=JSON.parse(raw);lastPayload=raw;return data;});
 }
 // Development preview only. The installed native view creates no HTTP server.
 return fetch(route,{method:data?'POST':'GET',headers:{'X-LSF-Key':nonce,'Content-Type':'application/json'},credentials:'omit',body:data?JSON.stringify(data):undefined}).then(function(r){if(!r.ok)throw Error('请求未完成。');return r.json();});
}
function mark(el,on){el.checked=!!on;el.classList.toggle('on',!!on);el.textContent=on?'✓':'';el.setAttribute('aria-checked',on?'true':'false');}
function choices(id,options){var menu=$(id+'-choices');menu.innerHTML=options.map(function(o){return '<button data-value="'+esc(o.key)+'">'+esc(o.label)+'</button>';}).join('');}
function closeChoices(){Array.prototype.forEach.call(document.querySelectorAll('.choices'),function(el){el.classList.remove('open');});}
['nation','mode'].forEach(function(id){$(id).value=id==='mode'?'1':'';$(id).addEventListener('click',function(){var menu=$(id+'-choices'),open=!menu.classList.contains('open');closeChoices();menu.classList.toggle('open',open);});$(id+'-choices').addEventListener('click',function(e){var button=e.target.closest('button');if(!button)return;$(id).value=button.getAttribute('data-value');$(id).textContent=button.textContent;closeChoices();if(id==='nation')filter(true);});});
document.addEventListener('mousedown',function(e){if(!e.target.closest('.dropdown'))closeChoices();});
choices('mode',modeNames.map(function(label,i){return{key:String(i),label:label};}));
mark($('enabled'),true);mark($('select-visible'),false);

function counts(){var n=keys(selected).length,visible=filtered.filter(function(c){return selected[c.key];}).length;$('selection-count').textContent='已选 '+n+' 款'+(n>visible?' · 当前结果 '+visible:'');$('apply').disabled=!n||!!pending;mark($('select-visible'),!!filtered.length&&visible===filtered.length);$('select-visible').indeterminate=visible>0&&visible<filtered.length;}
function syncSelection(next){selected=next;Array.prototype.forEach.call(rows.querySelectorAll('.car-row'),function(row){var on=!!selected[row.getAttribute('data-key')];if(row.classList.contains('selected')!==on){row.classList.toggle('selected',on);mark(row.querySelector('.pick'),on);}});counts();}
function filter(resetScroll){var nation=$('nation').value,query=$('search').value.trim().toLowerCase().split(/\s+/).filter(Boolean);filtered=state.cars.filter(function(c){return(!nation||c.nation===nation)&&query.every(function(q){return(c.label+' '+c.code+' '+c.key).toLowerCase().indexOf(q)>=0;});});anchor=-1;render(resetScroll);}
function rowHtml(c,i){var mode=state.rules[c.key]||0,cache=c.prepared?'已准备':(c.overridden?'等待准备':'无本地覆盖');return'<div class="car-row'+(selected[c.key]?' selected':'')+'" data-key="'+esc(c.key)+'" data-index="'+i+'" title="'+esc(c.label+' / '+c.code)+'"><button class="check pick'+(selected[c.key]?' on':'')+'" role="checkbox" aria-label="选择 '+esc(c.label)+'">'+(selected[c.key]?'✓':'')+'</button><div class="name">'+esc(c.label)+'<div class="code">'+esc(c.code)+'</div></div><span class="nation">'+esc(c.nationLabel)+'</span><span class="mode '+modeClasses[mode]+'">'+modeNames[mode]+'</span><span class="cache'+(c.prepared?' ready':'')+'">'+cache+'</span></div>';}
function paintWindow(force){
 if(!filtered.length)return;
 var first=Math.max(0,Math.floor(vp.scrollTop/42)-5),last=Math.min(filtered.length,Math.ceil((vp.scrollTop+Math.max(84,vp.clientHeight))/42)+5);
 if(!force&&first===windowStart&&last===windowEnd)return;
 windowStart=first;windowEnd=last;
 var html='<div class="spacer" style="height:'+(first*42)+'px"></div>';
 for(var i=first;i<last;i++)html+=rowHtml(filtered[i],i);
 html+='<div class="spacer" style="height:'+((filtered.length-last)*42)+'px"></div>';
 rows.innerHTML=html;
}
function render(resetScroll){
 var scroll=resetScroll?0:vp.scrollTop;windowStart=-1;windowEnd=-1;
 rows.setAttribute('data-total',String(filtered.length));
 if(!filtered.length){rows.innerHTML='<div class="empty">'+(state.loading?'正在读取本区车型…':'没有找到车型。试试名称、编号，或切换国家。')+'</div>';counts();return;}
 // Set spacer geometry before restoring scroll, so a filtered result never
 // retains a position beyond its own range.
 rows.innerHTML='<div class="spacer" style="height:'+(filtered.length*42)+'px"></div>';
 vp.scrollTop=Math.min(scroll,Math.max(0,filtered.length*42-vp.clientHeight));
 paintWindow(true);counts();
}
vp.addEventListener('scroll',function(){paintWindow(false);});
window.addEventListener('resize',function(){paintWindow(true);});

function setBusy(){var busy=!!pending;$('all-enemies').disabled=busy||!state.cars.length;$('enabled').disabled=busy;counts();}
function command(value){if(pending)return;pending=-1;setBusy();tell('正在保存选择…');request('/api/command',value).then(function(r){pending=r.ticket;poll();}).catch(function(e){pending=0;setBusy();tell(e.message,true);});}
function accept(data){if(!data||!Array.isArray(data.cars))return;state=data;if(pending>0&&data.appliedTicket>=pending){pending=0;tell(data.commandError||data.commandMessage||'选择已保存。',!!data.commandError);}setBusy();mark($('enabled'),data.enabled!==false);$('region').textContent=(data.realm||'')+' '+(data.version||'')+' · '+data.cars.length+' 款车型';$('summary').textContent='检测到 '+(data.overrideCount||0)+' 款车型有本地覆盖；仅准备需要恢复的车型。';if(!pending&&data.progress&&!data.commandError){tell(data.commandMessage||data.progress);}if(data.revision!==lastRevision&&!drag){lastRevision=data.revision;choices('nation',[{key:'',label:'全部国家'}].concat(data.nations));filter(false);}}
function poll(){request('/api/state').then(accept).catch(function(){tell('暂时无法读取设置。请从游戏模组列表重新打开本窗口。',true);});}
$('search').addEventListener('input',function(){filter(true);});$('nation').addEventListener('change',function(){filter(true);});
$('select-all').addEventListener('click',function(){var next=copy(selected);filtered.forEach(function(c){next[c.key]=true;});syncSelection(next);});
$('select-visible').addEventListener('click',function(){var next=copy(selected),on=!this.checked;mark(this,on);filtered.forEach(function(c){if(on)next[c.key]=true;else delete next[c.key];});syncSelection(next);});
$('clear-selection').addEventListener('click',function(){syncSelection({});});
$('apply').addEventListener('click',function(){command({kind:'rules',keys:keys(selected),mode:Number($('mode').value)});});
$('all-enemies').addEventListener('click',function(){command({kind:'all_enemies'});});
$('enabled').addEventListener('click',function(){command({kind:'enabled',enabled:!this.checked});});
rows.addEventListener('click',function(e){if(!e.target.closest('.pick'))return;var row=e.target.closest('.car-row');if(!row)return;var next=copy(selected),key=row.getAttribute('data-key');if(!selected[key])next[key]=true;else delete next[key];syncSelection(next);});
function position(e){var r=vp.getBoundingClientRect();return{x:Math.max(0,Math.min(vp.clientWidth,e.clientX-r.left-vp.clientLeft)),y:Math.max(0,Math.min(vp.clientHeight,e.clientY-r.top-vp.clientTop))+vp.scrollTop};}
function updateDrag(){if(!drag||!drag.active)return;var p=position(drag.last),low=Math.min(drag.start.y,p.y),high=Math.max(drag.start.y,p.y),next=copy(drag.base),first=Math.max(0,Math.floor(low/42)),last=Math.min(filtered.length-1,Math.floor(high/42));if(Math.abs(p.x-drag.start.x)>=1){for(var i=first;i<=last;i++){if(high>i*42&&low<(i+1)*42)next[filtered[i].key]=true;}}syncSelection(next);var r=vp.getBoundingClientRect(),top=r.top+vp.clientTop,bottom=top+vp.clientHeight,y1=Math.max(top,Math.min(bottom,top+drag.start.y-vp.scrollTop)),y2=Math.max(top,Math.min(bottom,drag.last.clientY));box.style.display='block';box.style.left=(r.left+vp.clientLeft+Math.min(drag.start.x,p.x))+'px';box.style.top=Math.min(y1,y2)+'px';box.style.width=Math.max(1,Math.abs(p.x-drag.start.x))+'px';box.style.height=Math.max(1,Math.abs(y2-y1))+'px';}
vp.addEventListener('mousedown',function(e){if(e.button!==0||e.target.closest('.pick')||!filtered.length)return;e.preventDefault();var row=e.target.closest('.car-row');drag={start:position(e),origin:{x:e.clientX,y:e.clientY},last:{clientX:e.clientX,clientY:e.clientY},base:e.ctrlKey||e.metaKey?copy(selected):{},active:false,index:row?Number(row.getAttribute('data-index')):-1,ctrl:e.ctrlKey||e.metaKey,shift:e.shiftKey};scrollTimer=setInterval(function(){if(!drag||!drag.active)return;var r=vp.getBoundingClientRect(),delta=drag.last.clientY<r.top+28?-18:(drag.last.clientY>r.bottom-28?18:0);if(delta){vp.scrollTop+=delta;updateDrag();}},35);});
document.addEventListener('mousemove',function(e){if(!drag)return;drag.last={clientX:e.clientX,clientY:e.clientY};if(!drag.active&&(Math.abs(e.clientX-drag.origin.x)>4||Math.abs(e.clientY-drag.origin.y)>4)){drag.active=true;}updateDrag();});
function finish(){if(!drag)return;if(!drag.active){var next=drag.ctrl?copy(selected):{};if(drag.index>=0){if(drag.shift&&anchor>=0){for(var i=Math.min(anchor,drag.index);i<=Math.max(anchor,drag.index);i++){next[filtered[i].key]=true;}}else{var key=filtered[drag.index].key;if(drag.ctrl&&next[key])delete next[key];else next[key]=true;anchor=drag.index;}}syncSelection(next);}drag=null;clearInterval(scrollTimer);scrollTimer=null;box.style.display='none';}
document.addEventListener('mouseup',finish);window.addEventListener('blur',finish);document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(drag){finish();return;}if(nativeView&&window.model)window.model.onClose();return;}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='a'&&e.target.tagName!=='INPUT'){e.preventDefault();$('select-all').click();}});
$('close').addEventListener('click',function(){if(nativeView&&window.model)window.model.onClose();});
function start(){poll();setInterval(poll,500);}
if(nativeView){var domReady=typeof window.isDomBuilt==='boolean'&&!window.isDomBuilt?new Promise(function(resolve){window.engine.on('self.onDomBuilt',resolve);}):Promise.resolve();Promise.all([window.engine.whenReady,domReady]).then(start).catch(function(){tell('游戏界面加载失败，请关闭后重新打开。',true);});}
else if(nonce){start();}else{tell('请从游戏内模组列表打开此窗口。',true);}
})();
</script></body></html>
